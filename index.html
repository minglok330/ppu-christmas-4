(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR,angle=0;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();

let last=0;function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;let bg=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.75);bg.addColorStop(0,'#14251d');bg.addColorStop(.62,'#091610');bg.addColorStop(1,'#030907');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let rawReveal=Math.min(1,Math.max(0,(now-250)/4300));let reveal=rawReveal*rawReveal*(3-2*rawReveal);let intro=introMix(now);let fullTreeReveal=Math.max(0,Math.min(1,(now-6800)/2300));fullTreeReveal=fullTreeReveal*fullTreeReveal*(3-2*fullTreeReveal);ctx.globalAlpha=reveal;let draw=[];for(let i=0;i<particleTargets.length;i++){const p=particleTargets[i],a=introStarts[i],m={x:a.x+(p.x-a.x)*intro,y:a.y+(p.y-a.y)*intro,z:a.z+(p.z-a.z)*intro,c:p.c};let q=project(m,angle);if(q){let sz=Math.max(.65,3.6-q[2]*.13)*(W<700?.7:1);draw.push([q[2],q[0],q[1],sz,p.c,1])}}const still=tree.slice(1400).concat(ground.slice(90),stars.slice(35));ctx.globalAlpha=reveal*fullTreeReveal;for(const p of still){let q=project(p,angle);if(q){let sz=Math.max(.65,3.6-q[2]*.13)*(W<700?.7:1);draw.push([q[2],q[0],q[1],sz,p.c,fullTreeReveal])}}ctx.globalAlpha=reveal;for(const p of heart){let q=project(p,angle);if(q){let sz=Math.max(.65,3.6-q[2]*.13)*(W<700?.7:1);draw.push([q[2],q[0],q[1],sz,p.c])}}draw.sort((a,b)=>b[0]-a[0]);for(const d of draw){let [depth,x,y,s,c,a=1]=d;if(x<0||x>W||y<0||y>H)continue;ctx.globalAlpha=reveal*a;ctx.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;ctx.shadowBlur=s>2?5:0;ctx.shadowColor='#C7E0A6';ctx.beginPath();ctx.arc(x,y,s,0,TAU);ctx.fill()}ctx.shadowBlur=0;

// Refined typography: restrained champagne gold + ivory, with a fine divider

ctx.globalAlpha=reveal;ctx.fillStyle='#D8BC83';ctx.font=`italic ${Math.max(27,Math.min(43,W*.068))}px Georgia,'Times New Roman',serif`;ctx.fillText('Merry Christmas',W/2,titleY);
const lineW=Math.min(150,W*.32);ctx.strokeStyle='rgba(216,188,131,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W/2-lineW/2,titleY+17);ctx.lineTo(W/2+lineW/2,titleY+17);ctx.stroke();
